sonar.projectKey=taskira
sonar.projectName=Taskira
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.spec.ts

sonar.exclusions=frontend/dist/**,frontend/node_modules/**,frontend/coverage/**,backend/target/**,e2e/playwright/playwright-report/**,e2e/playwright/test-results/**

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/taskira-web/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/taskira-web/lcov.info
