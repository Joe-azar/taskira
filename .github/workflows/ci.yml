name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit and PostgreSQL integration tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@11.9.0

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build the production frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-reports
          path: |
            frontend/coverage/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 7

  containers-e2e:
    name: Containers and E2E
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and start an ephemeral application stack
        run: docker compose -p taskira-ci -f infra/docker-compose.yml up --detach --build

      - name: Wait for frontend and backend readiness
        run: |
          wait_for_url() {
            name="$1"
            url="$2"
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                echo "$name is ready"
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $name at $url" >&2
            docker compose -p taskira-ci -f infra/docker-compose.yml ps
            return 1
          }

          wait_for_url frontend http://localhost:4200/
          wait_for_url backend http://localhost:8080/v3/api-docs

      - name: Build the pinned Playwright image
        run: docker build -f frontend/Dockerfile.e2e -t taskira-frontend-e2e:ci frontend

      - name: Run Playwright
        run: |
          mkdir -p frontend/playwright-report frontend/test-results
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            --volume "${PWD}/frontend/playwright-report:/app/playwright-report" \
            --volume "${PWD}/frontend/test-results:/app/test-results" \
            taskira-frontend-e2e:ci

      - name: Capture Compose logs
        if: always()
        run: docker compose -p taskira-ci -f infra/docker-compose.yml logs --no-color > taskira-compose.log 2>&1 || true

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            taskira-compose.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the ephemeral application stack
        if: always()
        run: docker compose -p taskira-ci -f infra/docker-compose.yml down --volumes --remove-orphans
