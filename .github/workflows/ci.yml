name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21.0.11+10.0.LTS"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit and PostgreSQL integration tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@11.9.0

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build the production frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-reports
          path: |
            frontend/coverage/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 7

  containers-e2e:
    name: Containers and E2E
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare E2E artifact directories
        run: |
          mkdir -p e2e/playwright/playwright-report
          mkdir -p e2e/playwright/test-results

      - name: Build and run the isolated E2E stack
        run: >-
          docker compose -p taskira-ci-e2e
          -f e2e/playwright/compose.e2e.yml
          up --build --abort-on-container-exit --exit-code-from e2e

      - name: Capture Compose logs
        if: always()
        run: >-
          docker compose -p taskira-ci-e2e
          -f e2e/playwright/compose.e2e.yml
          logs --no-color > e2e/playwright/compose.log 2>&1 || true

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: |
            e2e/playwright/playwright-report/
            e2e/playwright/test-results/
            e2e/playwright/compose.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the ephemeral application stack
        if: always()
        run: >-
          docker compose -p taskira-ci-e2e
          -f e2e/playwright/compose.e2e.yml
          down --volumes --remove-orphans

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend
      - frontend
      - containers-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every CI job to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.containers-e2e.result }}
        run: |
          printf 'backend=%s\nfrontend=%s\ncontainers-e2e=%s\n' \
            "$BACKEND_RESULT" "$FRONTEND_RESULT" "$E2E_RESULT"

          if [[ "$BACKEND_RESULT" != "success" \
            || "$FRONTEND_RESULT" != "success" \
            || "$E2E_RESULT" != "success" ]]; then
            echo "At least one required CI job did not succeed." >&2
            exit 1
          fi
