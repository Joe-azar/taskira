server {
    listen 8080;
    # The base image's entrypoint normally patches IPv6 listening into its packaged
    # default.conf automatically, but skips that once it detects a custom config (see
    # the "differs from the packaged version" log line) - without this, "listen 8080"
    # binds IPv4 only, and the healthcheck's `wget http://localhost:8080/...` resolves
    # localhost to ::1 first inside the container and fails with connection refused.
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker's embedded DNS server, present on every container attached to
    # a user-defined bridge network. A static "proxy_pass http://backend:8080;" resolves
    # the hostname once at config-load time and refuses to start nginx at all if it
    # doesn't resolve yet (confirmed: crashed with "host not found in upstream" when
    # started before a backend container existed on the network). Routing proxy_pass
    # through a variable defers resolution to request time instead, so nginx starts
    # regardless of backend's readiness and only individual requests fail (502) until
    # backend is reachable.
    resolver 127.0.0.11 valid=10s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Dedicated health signal, not the app shell - so a healthcheck failure means
    # "Nginx isn't serving," not "Angular's index.html happens to be missing."
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ^~ stops nginx from also checking the hashed-asset regex location below for any
    # path under /api/ - a proxied request must never be reinterpreted as a static file
    # lookup. No URI after the port in proxy_pass: /api/v1/... is forwarded unchanged.
    location ^~ /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular's esbuild output hashes bundle filenames (main-XXXXXXXX.js,
    # chunk-XXXXXXXX.js, styles-XXXXXXXX.css) - safe to cache aggressively since a
    # content change always produces a new filename. Anything else (favicon.ico,
    # unhashed assets from public/) is deliberately left at nginx's default, unhashed
    # caching would go stale silently across deploys.
    location ~* "-[A-Za-z0-9_]{6,10}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must never be cached - it references the current build's hashed
    # filenames, so a stale cached copy would point at assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: any unmatched path (client-side route or unknown deep link) serves
    # the app shell, which then handles routing/404 itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
