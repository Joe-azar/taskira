logging:
  pattern:
    # Base/dev/test default: human-readable console output, with the per-request
    # correlation id (set by RequestIdFilter) bracketed so log lines for one request are
    # easy to grep together. Overridden to structured JSON in application-prod.yaml.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"

spring:
  application:
    name: taskira-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskira}
    username: ${SPRING_DATASOURCE_USERNAME:taskira}
    password: ${SPRING_DATASOURCE_PASSWORD:taskira}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: TASKIRA_SESSION
        http-only: true
        same-site: lax
        # Base/dev/test default: this stack runs over plain HTTP locally, and a Secure
        # cookie is never sent by the browser over HTTP. Overridden to true in
        # application-prod.yaml, the only environment expected to run over HTTPS.
        secure: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  server:
    # Actuator lives on its own port, never published to the host (see
    # infra/docker-compose.yml) - Prometheus reaches it over the internal Docker
    # network only. That's the actual security boundary here, not an app-level
    # credential: this stack is Docker Compose, not Kubernetes (ADR-0011), and
    # there is no machine-to-machine auth mechanism to hand Prometheus otherwise.
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        # Explicit allowlist, not "*" - env/beans/heapdump/configprops/mappings/
        # threaddump/shutdown stay unmapped even on the isolated port.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}