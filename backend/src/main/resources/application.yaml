spring:
  application:
    name: taskira-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskira}
    username: ${SPRING_DATASOURCE_USERNAME:taskira}
    password: ${SPRING_DATASOURCE_PASSWORD:taskira}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: TASKIRA_SESSION
        http-only: true
        same-site: lax
        # Base/dev/test default: this stack runs over plain HTTP locally, and a Secure
        # cookie is never sent by the browser over HTTP. Overridden to true in
        # application-prod.yaml, the only environment expected to run over HTTPS.
        secure: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:taskira-super-secret-key-change-me-at-least-32-characters}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}