logging:
  pattern:
    # Base/dev/test default: human-readable console output, with the per-request
    # correlation id (set by RequestIdFilter) bracketed so log lines for one request are
    # easy to grep together. Overridden to structured JSON in application-prod.yaml.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"

spring:
  application:
    name: taskira-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskira}
    username: ${SPRING_DATASOURCE_USERNAME:taskira}
    password: ${SPRING_DATASOURCE_PASSWORD:taskira}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      # BATCH_* tables come from Flyway V10, not this starter's own initializer - one
      # source of schema truth, same rule as ddl-auto: validate for Hibernate above.
      initialize-schema: never
    job:
      # Without this, Spring Boot runs every Job bean in the context as a
      # CommandLineRunner at application startup. ticketsBulkExportJob must only ever
      # run when an admin explicitly triggers it over HTTP (see exports.batch config).
      enabled: false

  mail:
    # Mailpit in every environment that sends mail at all (infra/docker-compose.yml) -
    # a real SMTP relay for a real production is a separate, later decision (see
    # ADR-0020). No auth, no TLS: Mailpit doesn't need either.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      # Rejected before the request body is even fully read, not just at the service
      # layer - app.attachments.max-size-bytes below is the same limit enforced again
      # once the real (Tika-detected) content type is known, defense in depth.
      max-file-size: 20MB
      max-request-size: 20MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: TASKIRA_SESSION
        http-only: true
        same-site: lax
        # Base/dev/test default: this stack runs over plain HTTP locally, and a Secure
        # cookie is never sent by the browser over HTTP. Overridden to true in
        # application-prod.yaml, the only environment expected to run over HTTPS.
        secure: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  notifications:
    from-address: ${APP_NOTIFICATIONS_FROM_ADDRESS:noreply@taskira.test}
  attachments:
    # Relative to the JVM's working directory, not an absolute system path: this default
    # must be writable with zero provisioning wherever the app boots directly - a bare CI
    # runner running `mvn verify`, a developer's machine, any *Test/*IT that starts the
    # full context - not only inside this repo's own Docker image, which happens to
    # pre-create and chown a directory for it (see backend/Dockerfile and the
    # docker-compose volume mounts, which point at wherever this default resolves to
    # under the image's WORKDIR). Never served directly - files are only ever reached
    # through AttachmentController's streamed download.
    storage-path: ${APP_ATTACHMENTS_STORAGE_PATH:./data/attachments}
    max-size-bytes: ${APP_ATTACHMENTS_MAX_SIZE_BYTES:20971520}
  exports:
    # Canonical origin used only to build the scannable QR code link back to a ticket's
    # web page in the single-ticket PDF report - distinct from app.cors.allowed-origins
    # (a whitelist, can hold several values) which serves a different purpose.
    frontend-url: ${APP_EXPORTS_FRONTEND_URL:http://localhost:4200}

management:
  server:
    # Actuator lives on its own port, never published to the host (see
    # infra/docker-compose.yml) - Prometheus reaches it over the internal Docker
    # network only. That's the actual security boundary here, not an app-level
    # credential: this stack is Docker Compose, not Kubernetes (ADR-0011), and
    # there is no machine-to-machine auth mechanism to hand Prometheus otherwise.
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        # Explicit allowlist, not "*" - env/beans/heapdump/configprops/mappings/
        # threaddump/shutdown stay unmapped even on the isolated port.
        include: health,info,prometheus
  health:
    # Mailpit/SMTP is best-effort by design (see ADR-0020): a notification email that
    # fails to send must never make the application report unhealthy. Confirmed the
    # hard way - with spring-boot-starter-mail on the classpath, Actuator auto-
    # configures a mail health indicator that otherwise drags the aggregate
    # /actuator/health down to 503 whenever no SMTP server is reachable.
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}