logging:
  structured:
    # Boot's built-in Logstash JSON encoder - no extra dependency needed. MDC entries
    # (requestId, set by RequestIdFilter) are included automatically.
    format:
      console: logstash

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  servlet:
    session:
      cookie:
        secure: true
