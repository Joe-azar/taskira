# Fixed component names (postgres/backend/frontend), not release-name-prefixed: this
# chart targets one release per namespace, exactly like the raw manifests it was built
# from (P17, ADR-0025) - the backend Service must stay named "backend" to match
# frontend/nginx/default.conf's proxy_pass hostname, and postgres must stay named
# "postgres" to match SPRING_DATASOURCE_URL. A general-purpose reusable chart would
# template these with .Release.Name, which this lab doesn't need.

postgres:
  image: "postgres:18.6-alpine3.23@sha256:f65cfc1a73466fc0807f4a33496e1c438b19269091c8f998faec871874df8e5e"
  database: taskira
  user: taskira
  # No default password here on purpose (ADR-0025): pass with
  # --set postgres.password=... or -f a gitignored values file. templates/secret.yaml
  # uses `required` and fails to render without it - the same discipline already applied
  # to scripts/up.ps1's -PostgresPassword in the raw-manifest lab (P17).
  storage: 1Gi

backend:
  image:
    # The real image published to GHCR by P15's release workflow (ADR-0024/0025), not a
    # locally rebuilt one.
    repository: ghcr.io/joe-azar/taskira-backend
    tag: v0.1.0
  corsAllowedOrigins: "http://localhost"
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi

frontend:
  image:
    repository: ghcr.io/joe-azar/taskira-frontend
    tag: v0.1.0
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

ingress:
  # Default ingress-nginx body size (1m) is too small for a real attachment upload (P13).
  proxyBodySize: 20m
