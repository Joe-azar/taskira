# `required` fails the render outright if postgres.password is missing, rather than
# rendering a Secret with an empty/placeholder value that would silently work its way
# into a real cluster (ADR-0025) - same discipline as -PostgresPassword being mandatory
# with no default in the raw-manifest lab's scripts/up.ps1 (P17).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ required "postgres.password is required - pass it with --set postgres.password=... or -f a gitignored values file, never commit it" .Values.postgres.password | quote }}
