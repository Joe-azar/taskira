# Template only, never applied directly - the real Secret is created imperatively by
# scripts/up.ps1 from its mandatory -PostgresPassword parameter (same discipline as
# infra/.env.prodlike.example / infra/.env.staging.example: a committed .example shows
# the shape, the real value never reaches git). Kept here purely as documentation of
# what scripts/up.ps1 generates - `kubectl apply -f` on this literal file would create a
# Secret containing the literal string "REPLACE_ME", which is intentionally unusable.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: taskira
type: Opaque
stringData:
  password: REPLACE_ME
