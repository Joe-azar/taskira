services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:f65cfc1a73466fc0807f4a33496e1c438b19269091c8f998faec871874df8e5e
    container_name: taskira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskira
      POSTGRES_USER: taskira
      POSTGRES_PASSWORD: taskira
    ports:
      - "5432:5432"
    volumes:
      - taskira_postgres_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskira -d taskira"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: taskira-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskira
      SPRING_DATASOURCE_USERNAME: taskira
      SPRING_DATASOURCE_PASSWORD: taskira
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: taskira-frontend
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm start -- --host 0.0.0.0 --poll 1000
    ports:
      - "4200:4200"

volumes:
  # PostgreSQL 18 data (post-P6 migration). Named explicitly (no compose project
  # prefix) so it matches the volume populated by the documented migration
  # procedure in scripts/backup and scripts/restore. The old, project-prefixed
  # PostgreSQL 16 volume from before this migration is intentionally left
  # unreferenced, not deleted - it is the rollback path until the P6 migration
  # is fully validated. See docs/adr/0017-postgresql-18-migration.md.
  taskira_postgres_data_pg18:
    name: taskira_postgres_data_pg18
