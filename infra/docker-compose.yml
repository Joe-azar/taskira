services:
  postgres:
    image: postgres:16-alpine
    container_name: taskira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskira
      POSTGRES_USER: taskira
      POSTGRES_PASSWORD: taskira
    ports:
      - "5432:5432"
    volumes:
      - taskira_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskira -d taskira"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: taskira-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskira
      SPRING_DATASOURCE_USERNAME: taskira
      SPRING_DATASOURCE_PASSWORD: taskira
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: taskira-frontend
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm start -- --host 0.0.0.0 --poll 1000
    ports:
      - "4200:4200"

volumes:
  taskira_postgres_data: