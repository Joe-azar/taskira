services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:f65cfc1a73466fc0807f4a33496e1c438b19269091c8f998faec871874df8e5e
    container_name: taskira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskira
      POSTGRES_USER: taskira
      POSTGRES_PASSWORD: taskira
    ports:
      - "5432:5432"
    volumes:
      - taskira_postgres_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskira -d taskira"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: taskira-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskira
      SPRING_DATASOURCE_USERNAME: taskira
      SPRING_DATASOURCE_PASSWORD: taskira
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9091
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
      # 9091 (Actuator/Prometheus) is intentionally not published here - only reachable
      # from other containers on the compose network (e.g. prometheus), never the host.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: taskira-frontend
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm start -- --host 0.0.0.0 --poll 1000
    ports:
      - "4200:4200"

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: taskira-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - taskira_prometheus_data:/prometheus
    ports:
      # Dev convenience only, same rationale as postgres's 5432 publish - the UI is
      # useful locally to confirm the backend target is UP. Not exposed in prod (P11).
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    container_name: taskira-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-taskira}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Dashboards live under provisioning/dashboards/json on the host (see
      # provisioning/dashboards/dashboards.yml) so this is a single bind mount, not two
      # nested ones - mounting a second bind mount inside an already-:ro parent mount
      # fails (Docker can't create the child mountpoint on a read-only filesystem).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - taskira_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  # PostgreSQL 18 data (post-P6 migration). Named explicitly (no compose project
  # prefix) so it matches the volume populated by the documented migration
  # procedure in scripts/backup and scripts/restore. The old, project-prefixed
  # PostgreSQL 16 volume from before this migration is intentionally left
  # unreferenced, not deleted - it is the rollback path until the P6 migration
  # is fully validated. See docs/adr/0017-postgresql-18-migration.md.
  taskira_postgres_data_pg18:
    name: taskira_postgres_data_pg18
  taskira_prometheus_data:
    name: taskira_prometheus_data
  taskira_grafana_data:
    name: taskira_grafana_data
